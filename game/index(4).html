'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d'),W=360,H=480;g.scale(2,2);const $=id=>document.getElementById(id);let seed=37;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const obstacles=[{x:76,y:106,r:25,type:'flowers'},{x:278,y:342,r:28,type:'flowers'},{x:257,y:130,r:16,type:'rock'},{x:92,y:340,r:14,type:'rock'}], treasures=[{x:170,y:103,name:'Stone mosaic'},{x:274,y:248,name:'Lost toy'},{x:160,y:379,name:'Garden gnome'}];let mess=[],balls=[],poops=[],tracks=[],grass=[],particles=[],m,drag=null,keys={},total=0,cut=0,finished=false,toast='',until=0,audio=null,motor=null,gain=null,sound=false;const bg=document.createElement('canvas');bg.width=360;bg.height=480;const b=bg.getContext('2d');function reset(){seed=(Math.random()*4294967296)>>>0;grass=[];particles=[];mess=[];tracks=[];balls=[];poops=[];cut=0;finished=false;drag=null;keys={};toast='';m={x:180,y:443,a:-Math.PI/2,v:0,vx:0,vy:0,dirty:0};treasures.length=0;const placed=[];function spot(){for(let i=0;i<1000;i++){let x=35+rnd()*290,y=40+rnd()*365;if(!obstacles.some(o=>Math.hypot(x-o.x,y-o.y)<o.r+35)&&!placed.some(o=>Math.hypot(x-o.x,y-o.y)<35)){let p={x,y};placed.push(p);return p}}return {x:180,y:220}}for(const name of ['Stone mosaic','Lost toy','Garden gnome','Skull','Rib cage','Leg bone'])treasures.push({...spot(),name,found:false});for(let i=0;i<4;i++)poops.push({...spot(),hit:false});for(let i=0;i<3;i++)balls.push({...spot(),vx:0,vy:0});b.fillStyle='#72994e';b.fillRect(0,0,W,H);for(let i=0;i<11000;i++){b.fillStyle=rnd()<.5?'#ffffff0b':'#203d1915';b.fillRect(rnd()*W,rnd()*H,2,2)}for(let y=25;y<455;y+=7)for(let x=23;x<338;x+=7){if(obstacles.some(o=>Math.hypot(x-o.x,y-o.y)<o.r+14))continue;grass.push({x:x+rnd()*3,y:y+rnd()*3,h:7+rnd()*8,k:rnd(),cut:false})}total=grass.length;}
function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function draw(){g.drawImage(bg,0,0);for(let i=0;i<12;i++){rect(0,i*40,360,20,'#d1e9a00b')}for(const t of treasures){if(t.name==='Stone mosaic'){for(let j=0;j<8;j++){let a=j*Math.PI/4;circle(t.x+Math.cos(a)*10,t.y+Math.sin(a)*10,5,j%2?'#b9a785':'#d7c6a1')}circle(t.x,t.y,5,'#ead8a6')}else if(t.name==='Lost toy'){rect(t.x-8,t.y-5,16,10,'#d65c45');rect(t.x-3,t.y-8,8,5,'#f0b95e');circle(t.x-5,t.y+5,3,'#26352f');circle(t.x+5,t.y+5,3,'#26352f')}else if(t.name==='Skull'){circle(t.x,t.y-3,9,'#e5dfc6');rect(t.x-5,t.y+2,10,8,'#e5dfc6');circle(t.x-4,t.y-3,2.5,'#34382f');circle(t.x+4,t.y-3,2.5,'#34382f');rect(t.x-1,t.y+1,2,3,'#34382f')}else if(t.name==='Rib cage'){rect(t.x-1,t.y-10,3,20,'#e5dfc6');for(let i=0;i<4;i++){g.strokeStyle='#e5dfc6';g.lineWidth=3;g.beginPath();g.ellipse(t.x,t.y-7+i*5,9-i,3,0,0,Math.PI*2);g.stroke()}}else if(t.name==='Leg bone'){g.save();g.translate(t.x,t.y);g.rotate(.7);rect(-2,-10,4,20,'#e5dfc6');for(let y of [-10,10])for(let x of [-3,3])circle(x,y,4,'#e5dfc6');g.restore()}else{circle(t.x,t.y,8,'#537c9b');circle(t.x,t.y-7,5,'#eac6a0');g.fillStyle='#c64c43';g.beginPath();g.moveTo(t.x-7,t.y-9);g.lineTo(t.x,t.y-22);g.lineTo(t.x+7,t.y-9);g.fill()}}
for(const p of poops){if(!p.hit){circle(p.x,p.y,6,'#694025');circle(p.x-2,p.y-3,4,'#916039');circle(p.x+1,p.y-6,3,'#a06a40')}}for(const p of mess)circle(p.x,p.y,p.r,p.color);for(const p of tracks){g.globalAlpha=p.life*.45;circle(p.x,p.y,3,'#674326')}g.globalAlpha=1;for(const p of balls){circle(p.x,p.y,5,'#dce94b');g.strokeStyle='#f5f5c5';g.lineWidth=1;g.beginPath();g.arc(p.x-2,p.y,3,-1.5,1.5);g.stroke()}for(const p of grass){if(p.cut)continue;rect(p.x-3,p.y-3,7,6,p.k>.5?'#426f32':'#4b7d34');g.strokeStyle=p.k>.65?'#92b95a':p.k>.3?'#65963e':'#355e2c';g.lineWidth=2;g.beginPath();g.moveTo(p.x,p.y+2);g.quadraticCurveTo(p.x-4,p.y-p.h*.5,p.x-3,p.y-p.h);g.moveTo(p.x,p.y+2);g.lineTo(p.x+4,p.y-p.h*.8);g.stroke()}

for(const p of particles){g.globalAlpha=Math.min(1,p.life*3);rect(p.x,p.y,3,2,p.color)}g.globalAlpha=1;g.save();g.translate(m.x,m.y);g.rotate(m.a);rect(-13,-14,30,30,'#203a2855');for(const x of [-9,10])for(const y of [-13,9])rect(x-5,y-3,10,6,'#25332e');rect(-12,-11,25,22,'#ad4638');rect(-10,-9,21,4,'#e77a51');circle(1,0,8,'#333e3a');circle(1,0,5,'#a8b0a2');rect(-25,-9,15,2,'#d5d9c9');rect(-25,7,15,2,'#d5d9c9');rect(-27,-10,3,20,'#303d37');g.restore();if(drag){g.strokeStyle='#fff7';g.lineWidth=1.5;g.beginPath();g.arc(drag.x,drag.y,24,0,7);g.stroke();circle(drag.x+drag.dx,drag.y+drag.dy,7,'#ffffff88')}if(performance.now()<until||finished){rect(35,208,290,49,'#101820dd');g.fillStyle='#e4f5d9';g.font='bold 14px system-ui';g.textAlign='center';g.fillText(finished?'PROJECT COMPLETE!':toast,180,237)}}
function step(dt){let dx=0,dy=0;if(drag){dx=drag.dx;dy=drag.dy}else{dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)}let mag=Math.hypot(dx,dy);if(mag>.08&&!finished){let desired=Math.atan2(dy,dx),diff=Math.atan2(Math.sin(desired-m.a),Math.cos(desired-m.a));m.a+=Math.max(-3.1*dt,Math.min(3.1*dt,diff));let target=115*Math.min(1,drag?mag/24:mag)*(1-.65*Math.min(1,Math.abs(diff)/Math.PI));m.v+=(target-m.v)*(1-Math.exp(-2.5*dt))}else m.v*=Math.exp(-1.7*dt);let blend=1-Math.exp(-5*dt);m.vx+=(Math.cos(m.a)*m.v-m.vx)*blend;m.vy+=(Math.sin(m.a)*m.v-m.vy)*blend;let nx=m.x+m.vx*dt,ny=m.y+m.vy*dt;if(nx<24||nx>336||ny<24||ny>456||obstacles.some(o=>Math.hypot(nx-o.x,ny-o.y)<o.r+13)){m.v*=.25;m.vx=0;m.vy=0}else{m.x=nx;m.y=ny}if(!finished){for(const p of poops){if(!p.hit&&Math.hypot(p.x-m.x,p.y-m.y)<17){p.hit=true;m.dirty=5;toast='SPLAT! Watch your wheels!';until=performance.now()+1600;for(let i=0;i<28;i++){let a=rnd()*6.283,r=rnd()*24;mess.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,r:1+rnd()*4,color:rnd()<.5?'#704522':'#986033'});particles.push({x:p.x,y:p.y,vx:Math.cos(a)*r*5,vy:Math.sin(a)*r*5,life:.3+rnd()*.5,color:'#754422'})}splat()}}if(m.dirty>0){m.dirty-=dt;if(m.v>12&&rnd()<dt*25){for(let side of [-1,1])tracks.push({x:m.x-Math.cos(m.a)*10+Math.sin(m.a)*side*12,y:m.y-Math.sin(m.a)*10-Math.cos(m.a)*side*12,life:1})}}for(const p of balls){let d=Math.hypot(p.x-m.x,p.y-m.y);if(d<19&&m.v>8){let a=Math.atan2(p.y-m.y,p.x-m.x);p.vx=Math.cos(a)*150+m.vx*.4;p.vy=Math.sin(a)*150+m.vy*.4}p.x+=p.vx*dt;p.y+=p.vy*dt;for(const axis of ['x','y']){let max=axis==='x'?W:H;if(p[axis]<19||p[axis]>max-19){p[axis]=Math.max(19,Math.min(max-19,p[axis]));p['v'+axis]*=-.75}}for(const o of obstacles){let dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy);if(d<o.r+5&&d>0){let nx=dx/d,ny=dy/d,dot=p.vx*nx+p.vy*ny;p.x=o.x+nx*(o.r+5);p.y=o.y+ny*(o.r+5);if(dot<0){p.vx-=1.7*dot*nx;p.vy-=1.7*dot*ny}}}p.vx*=Math.exp(-1.5*dt);p.vy*=Math.exp(-1.5*dt)}for(const p of grass){if(!p.cut&&Math.hypot(p.x-m.x,p.y-m.y)<15){p.cut=true;cut++;if(particles.length<180){particles.push({x:p.x,y:p.y,vx:-Math.cos(m.a)*35+(rnd()-.5)*60,vy:-Math.sin(m.a)*35+(rnd()-.5)*60,life:.4+rnd()*.4,color:p.k>.5?'#a6c96a':'#426f32'})}}}for(const t of treasures){if(!t.found&&!grass.some(p=>!p.cut&&Math.hypot(p.x-t.x,p.y-t.y)<13)){t.found=true;toast='Discovered: '+t.name;if(['Skull','Rib cage','Leg bone'].includes(t.name)&&treasures.filter(q=>['Skull','Rib cage','Leg bone'].includes(q.name)).every(q=>q.found))toast='DEAD END JOB! Skeleton collected';until=performance.now()+1800;ping()}}if(cut/total>=.95){finished=true;ping()}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);$('status').textContent=Math.floor(cut/total*100)+'% cleared · '+treasures.filter(t=>t.found).length+'/'+treasures.length+' discoveries';$('bar').style.width=cut/total*100+'%';$('speed').textContent=finished?'Job finished':m.v<3?'Motor idle':Math.round(m.v/115*100)+'% throttle';if(motor){motor.frequency.setTargetAtTime(38+m.v*.6,audio.currentTime,.1);gain.gain.setTargetAtTime(sound?.018+m.v*.00012:0,audio.currentTime,.1)}}
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}c.onpointerdown=e=>{if(drag)return;let p=point(e);drag={...p,dx:0,dy:0,id:e.pointerId};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;let p=point(e),x=p.x-drag.x,y=p.y-drag.y,k=Math.max(1,Math.hypot(x,y)/35);drag.dx=x/k;drag.dy=y/k};c.onpointerup=c.onpointercancel=c.onlostpointercapture=e=>{if(drag?.id===e.pointerId)drag=null};window.onkeydown=e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){e.preventDefault();keys[e.key]=true}};window.onkeyup=e=>keys[e.key]=false;window.onblur=()=>{keys={};drag=null};$('reset').onclick=reset;function splat(){if(!sound||!audio)return;let o=audio.createOscillator(),v=audio.createGain();o.type='sawtooth';o.frequency.setValueAtTime(125,audio.currentTime);o.frequency.exponentialRampToValueAtTime(35,audio.currentTime+.18);v.gain.setValueAtTime(.06,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+.23)}function ping(){if(!sound||!audio)return;let o=audio.createOscillator(),v=audio.createGain();o.frequency.value=660;o.frequency.exponentialRampToValueAtTime(990,audio.currentTime+.18);v.gain.setValueAtTime(.08,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.3);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+.31)}$('sound').onclick=async()=>{try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();motor=audio.createOscillator();motor.type='triangle';gain=audio.createGain();gain.gain.value=0;motor.connect(gain).connect(audio.destination);motor.start()}await audio.resume();sound=!sound;$('sound').textContent=sound?'Sound on':'Sound off'}catch(e){$('sound').textContent='Unavailable'}};reset();let last=performance.now();function frame(t){let dt=Math.min(.04,(t-la
