<!doctype html><html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Weed Wacker</title><style>*{box-sizing:border-box}body{margin:0;background:#181818;color:#eee;font:14px monospace;text-align:center}main{max-width:760px;margin:auto;padding:8px}canvas{width:100%;display:block;background:#789b52}button{background:#333;color:white;border:1px solid #777;border-radius:8px;padding:10px;touch-action:none}#controls{display:flex;align-items:center;justify-content:space-around;background:#292929;border:3px solid #555;padding:12px;border-radius:12px}#stick{width:30%;max-width:130px;aspect-ratio:1;border:2px solid #b77b40;border-radius:50%;background:#111;display:grid;place-items:center;touch-action:none}#knob{width:45%;aspect-ratio:1;background:#444;border-radius:50%;pointer-events:none}#power,#brake{border-radius:50%;background:#b32922;width:65px;height:65px;font-weight:bold}label{display:inline-block;width:31%;font-size:11px}input{width:95%;accent-color:#c98745}a{color:#d9ae70}select{background:#333;color:white;padding:8px}</style><main><a href="mow-money-menu.html">MOW MONEY / GAMES</a><h2>Weed Wacker</h2><canvas id=c width=640 height=420></canvas><div id=controls><div id=stick><div id=knob></div></div><button id=start>START</button><div><button id=power>POWER</button></div></div><p>LIVE AUDIO MIXER</p><label>ENGINE<input id=engine type=range value=65></label><label>GRASS<input id=grass type=range value=80></label><label>PRIZES<input id=prizes type=range value=100></label><select id=mode><option>Arcade</option><option selected>Soft Crunch</option><option>Realistic</option></select><button id=full>FULL SCREEN</button><p id=best></p></main><script>const $=s=>document.getElementById(s),g=$('c').getContext('2d'),W=640,H=420;let ax=0,ay=0,gas=false,brake=false,boost=false,active=false,started=false,done=false,t=0,cash=0,last=0,cutTime=0,ac,osc,eg,filter,buf,gb,pb,clock=0;const clamp=(v,l,h)=>Math.max(l,Math.min(h,v));function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}function ell(x,y,w,h,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,Math.max(.1,w),Math.max(.1,h),0,0,7);g.fill()}function poly(p,c){g.fillStyle=c;g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill()}function txt(s,x,y,n=16,c='white'){g.fillStyle=c;g.font=`bold ${n}px monospace`;g.fillText(s,x,y)}function audio(){try{if(!ac){ac=new AudioContext();osc=ac.createOscillator();osc.type='sawtooth';eg=ac.createGain();eg.gain.value=0;filter=ac.createBiquadFilter();filter.type='lowpass';osc.connect(filter);filter.connect(eg);eg.connect(ac.destination);osc.start();gb=ac.createGain();pb=ac.createGain();gb.connect(ac.destination);pb.connect(ac.destination);buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);let a=buf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}ac.resume()}catch(e){}}function noise(f,d,b){if(!ac)return;let s=ac.createBufferSource(),q=ac.createBiquadFilter(),v=ac.createGain();s.buffer=buf;q.type='lowpass';q.frequency.value=f;v.gain.setValueAtTime(.15,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);s.connect(q);q.connect(v);v.connect(b);s.start();s.stop(ac.currentTime+d)}function prize(bad=false){if(!ac)return;if(bad){noise(300,.35,pb);return} [660,880,1320].forEach((f,i)=>{let o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime+i*.1;o.frequency.value=f;v.gain.setValueAtTime(.1,n);v.gain.exponentialRampToValueAtTime(.001,n+.2);o.connect(v);v.connect(pb);o.start(n);o.stop(n+.21)})}function sound(dt){if(!ac)return;let m=$('mode').selectedIndex,n=ac.currentTime;eg.gain.setTargetAtTime(active&&gas?[.047,.033,.03][m]*$('engine').value/100:0,n,.06);osc.frequency.setTargetAtTime([130,105,85][m]*(cutTime>0?.81:1),n,.08);filter.frequency.value=[320,230,420][m];gb.gain.value=$('grass').value/100;pb.gain.value=$('prizes').value/100;clock-=dt;if(active&&cutTime>0&&clock<=0){noise([1700,850,1250][m],.08,gb);clock=[.075,.09,.055][m]}cutTime=Math.max(0,cutTime-dt)}let pid=null;function move(e){let r=$('stick').getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width*.25),y=(e.clientY-r.top-r.height/2)/(r.height*.25),m=Math.hypot(x,y),s=Math.pow(clamp((m-.08)/.92,0,1),1.3);ax=m?x/m*s:0;ay=m?y/m*s:0;$('knob').style.transform=`translate(${ax*12}px,${ay*12}px)`} $('stick').onpointerdown=e=>{pid=e.pointerId;$('stick').setPointerCapture(pid);move(e)};$('stick').onpointermove=e=>{if(e.pointerId===pid)move(e)};$('stick').onpointerup=$('stick').onpointercancel=$('stick').onlostpointercapture=()=>{pid=null;ax=ay=0;$('knob').style.transform='none'};let tap=-1000;$('power').onpointerdown=e=>{audio();$('power').setPointerCapture(e.pointerId);boost=performance.now()-tap<380;tap=performance.now();gas=true};$('power').onpointerup=$('power').onpointercancel=$('power').onlostpointercapture=()=>gas=boost=false;if($('brake')){$('brake').onpointerdown=e=>{$('brake').setPointerCapture(e.pointerId);brake=true};$('brake').onpointerup=$('brake').onpointercancel=$('brake').onlostpointercapture=()=>brake=false}const key='mow-'+document.title;function save(){try{localStorage.setItem(key,JSON.stringify({best:Math.max(cash,+(JSON.parse(localStorage.getItem(key)||'{}').best||0)),engine:$('engine').value,grass:$('grass').value,prizes:$('prizes').value,mode:$('mode').selectedIndex}))}catch(e){}}try{let s=JSON.parse(localStorage.getItem(key)||'{}');for(let k of ['engine','grass','prizes'])if(s[k]!=null)$(k).value=s[k];if(s.mode!=null)$('mode').selectedIndex=s.mode;$('best').textContent='Best earnings: $'+Math.floor(s.best||0)}catch(e){}for(let k of ['engine','grass','prizes','mode'])$(k).onchange=save;$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};$('start').onclick=()=>{audio();if(!started||done){reset();started=true;done=false;active=true}else active=!active;gas=false;$('start').textContent=active?'PAUSE':'RESUME'};function finish(){active=false;done=true;gas=false;save();$('start').textContent='RESTART';prize()} let x,z,a,sweep,plants,objs,parts,msg,mt,poo,wasps,found;const N=15,R=.32;function reset(){x=z=2;a=.3;sweep=t=cash=mt=poo=wasps=found=0;parts=[];msg='';objs=[{x:4,z:6,k:'tree',r:.34},{x:11,z:4,k:'tree',r:.36},{x:11,z:12,k:'tree',r:.38},{x:4,z:12,k:'tree',r:.34},{x:8,z:8,k:'bench',r:.6},{x:12,z:8,k:'rock',r:.3}];for(let k of ['poo','poo','poo','ball','ball','coin','coin','wallet','snake','nest','rock',...(Math.random()<.45?['treasure']:[])]){let X,Z;do{X=1+Math.random()*13;Z=1+Math.random()*13}while(Math.hypot(X-2,Z-2)<1.5||objs.some(o=>Math.hypot(X-o.x,Z-o.z)<.8));objs.push({x:X,z:Z,k,hidden:true})}plants=[];for(let i=0;i<49;i++)for(let j=0;j<49;j++){let X=.2+i*.3+Math.random()*.1,Z=.2+j*.3+Math.random()*.1;if(Math.hypot(X-2,Z-2)>.8&&!objs.some(o=>o.r&&Math.hypot(X-o.x,Z-o.z)<o.r))plants.push({x:X,z:Z,h:.38+Math.random()*.75,cut:false})}}function cam(X,Z){let dx=X-x,dz=Z-z;return[dx*Math.cos(a)-dz*Math.sin(a),dx*Math.sin(a)+dz*Math.cos(a)]}function p(X,Z,Y=0){let[u,d]=cam(X,Z);return d>.12?[320+u*320/d,115+(1.05-Y)*320/d,320/d,d]:null}function head(){return{x:x+Math.sin(a)*1.45+Math.cos(a)*Math.sin(sweep)*.095,z:z+Math.cos(a)*1.45-Math.sin(a)*Math.sin(sweep)*.095}}function burst(X,Z,col,n){for(let i=0;i<n;i++)parts.push({x:X,z:Z,y:.1,vx:(Math.random()-.5)*5,vz:(Math.random()-.5)*5,vy:1+Math.random()*4,life:1,col})}function update(dt){a+=ax*2.094*dt;let v=-ay*2.5, nx=clamp(x+Math.sin(a)*v*dt,.18,14.82),nz=clamp(z+Math.cos(a)*v*dt,.18,14.82),block=(X,Z)=>objs.some(o=>o.r&&Math.hypot(X-o.x,Z-o.z)<o.r+.09);if(!block(nx,z))x=nx;if(!block(x,nz))z=nz;mt-=dt;poo-=dt;wasps-=dt;if(gas){sweep+=dt*4;let h=head();for(let o of plants)if(!o.cut&&Math.hypot(o.x-h.x,o.z-h.z)<R){o.cut=true;cash+=.13;cutTime=.13;burst(o.x,o.z,'#b4cb65',24)}for(let o of objs)if(o.hidden&&Math.hypot(o.x-h.x,o.z-h.z)<R+.15){o.hidden=false;let val={ball:10,coin:25,wallet:50,treasure:150}[o.k]||0;cash+=val;found++;msg=o.k.toUpperCase()+(val?' +$'+val:'!');mt=2.5;prize(!val);if(val){o.reward=2.5;burst(o.x,o.z,'#ffdc50',65)}if(o.k==='poo'){poo=3.5;burst(o.x,o.z,'#80502a',100)}if(o.k==='nest')wasps=4;if(o.k==='rock')burst(o.x,o.z,'#ffbf45',60)}}for(let o of objs){if(o.reward>0)o.reward-=dt;if(o.k==='snake'&&!o.hidden)o.x+=dt*.9}for(let q of parts){q.x+=q.vx*dt;q.z+=q.vz*dt;q.y+=q.vy*dt;q.vy-=7*dt;q.life-=dt}parts=parts.filter(q=>q.life>0&&q.y>0).slice(-1800);if(plants.filter(o=>o.cut).length/plants.length>=.95){cash+=150;finish()}}function draw(){rect(0,0,640,115,'#9dbdca');rect(0,115,640,305,'#84964f');for(let i=0;i<15;i++)for(let k=0;k<4;k++){let A=k===0?[i,0]:k===1?[i,15]:k===2?[0,i]:[15,i],B=k===0?[i+1,0]:k===1?[i+1,15]:k===2?[0,i+1]:[15,i+1],q=[p(...A),p(...B),p(...B,2.1),p(...A,2.1)];if(q.every(Boolean))poly(q,i%2?'#92744d':'#a0855d')}let sprites=[];for(let o of plants){let q=p(o.x,o.z);if(q&&q[0]>-q[2]&&q[0]<640+q[2]){if(o.cut){let d=.15,pts=[p(o.x-d,o.z-d),p(o.x+d,o.z-d),p(o.x+d,o.z+d),p(o.x-d,o.z+d)];if(pts.every(Boolean))poly(pts,'#a9b66c')}sprites.push({o,q})}}for(let o of objs)if(!o.hidden){let q=p(o.x,o.z);if(q)sprites.push({o,q})}sprites.sort((a,b)=>b.q[3]-a.q[3]);for(let {o,q:[X,Y,s]} of sprites){if(!o.k){for(let i=0;i<7;i++){let dx=(i-3)*s*.045,h=(o.cut?.045:o.h)*s*(.6+i%3*.15);poly([[X+dx-s*.015,Y],[X+dx+s*.02,Y],[X+dx+(i-3)*s*.035,Y-h]],['#345a24','#527d31','#789a3d'][i%3])}}else if(o.k==='tree'){rect(X-s*.16,Y-s*3,s*.32,s*3,'#795332');ell(X,Y-s*3,s*1.3,s*.9,'#426e32')}else if(o.k==='bench'){rect(X-s*.8,Y-s*.5,s*1.6,s*.14,'#a17c4b');rect(X-s*.8,Y-s*.95,s*1.6,s*.32,'#987044');rect(X-s*.6,Y-s*.4,s*.08,s*.4,'#444');rect(X+s*.6,Y-s*.4,s*.08,s*.4,'#444')}else if(o.reward>0){let yy=Y-s*(.2+Math.abs(Math.sin((2.5-o.reward)*4))*.9);ell(X,yy,s*.13,s*.13,o.k==='ball'?'#cde84a':'#ffcf35');txt(msg,X-40,yy-15,20,'#ffe16c')}else if(['poo','rock','nest','snake'].includes(o.k))ell(X,Y-s*.08,s*.22,s*.12,o.k==='rock'?'#888':'#80502a')}let h=head(),q=p(h.x,h.z,.07),X=q[0],Y=q[1];if(gas){let ring=[];for(let i=0;i<40;i++){let a=i*Math.PI/20;ring.push(p(h.x+Math.cos(a)*R,h.z+Math.sin(a)*R,.07))}poly(ring,'#e2e5ca55')}ell(X,Y,24,10,'#222');rect(X-30,Y-19,60,13,'#e36c29');g.strokeStyle='#b9c0b8';g.lineWidth=10;g.beginPath();g.moveTo(468,420);g.lineTo(X,Y-12);g.stroke();poly([[0,420],[180,420],[400,365],[380,350],[140,390]],'#365a79');ell(395,365,22,13,'#d1a177');for(let o of parts){let q=p(o.x,o.z,o.y);if(q)rect(q[0],q[1],clamp(q[2]*.04,2,17),3,o.col)}if(poo>0){g.globalAlpha=Math.min(.8,poo*.5);for(let i=0;i<12;i++)ell((i*137)%640,65+(i*97)%340,20+i%4*8,18,'#79502b');g.globalAlpha=1}if(wasps>0)for(let i=0;i<16;i++)ell(320+Math.sin(t*8+i)*280,200+Math.cos(t*6+i*2)*150,6,4,'#dcb232');rect(0,0,640,45,'#202720');txt('$'+Math.floor(cash),10,20,19,'#ffe16c');txt('CUT '+Math.floor(plants.filter(o=>o.cut).length/plants.length*100)+'%   FINDS '+found,10,38,13);if(mt>0)txt(msg,220,75,19,'#ffe16c');rect(550,50,75,75,'#263622');for(let o of plants)rect(550+o.x*5,50+o.z*5,1.5,1.5,o.cut?'#b8c98a':'#526d32');ell(550+x*5,50+z*5,3,3,'#ffdc64')} reset();function frame(n){let dt=Math.min(.04,(n-(last||n))/1000);last=n;if(active){t+=dt;update(dt)}sound(dt);draw();if(!active){rect(70,135,500,130,'#202820ed');txt(done?'JOB COMPLETE — $'+Math.floor(cash):started?'PAUSED':'PRESS START',105,190,25,'#ffe18a');txt('MOW MONEY',105,230)}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
