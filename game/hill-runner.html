<!doctype html><html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Hill Runner</title><style>*{box-sizing:border-box}body{margin:0;background:#181818;color:#eee;font:14px monospace;text-align:center}main{max-width:760px;margin:auto;padding:8px}canvas{width:100%;display:block;background:#789b52}button{background:#333;color:white;border:1px solid #777;border-radius:8px;padding:10px;touch-action:none}#controls{display:flex;align-items:center;justify-content:space-around;background:#292929;border:3px solid #555;padding:12px;border-radius:12px}#stick{width:30%;max-width:130px;aspect-ratio:1;border:2px solid #b77b40;border-radius:50%;background:#111;display:grid;place-items:center;touch-action:none}#knob{width:45%;aspect-ratio:1;background:#444;border-radius:50%;pointer-events:none}#power,#brake{border-radius:50%;background:#b32922;width:65px;height:65px;font-weight:bold}label{display:inline-block;width:31%;font-size:11px}input{width:95%;accent-color:#c98745}a{color:#d9ae70}select{background:#333;color:white;padding:8px}</style><main><a href="mow-money-menu.html">MOW MONEY / GAMES</a><h2>Hill Runner</h2><canvas id=c width=640 height=420></canvas><div id=controls><div id=stick><div id=knob></div></div><button id=start>START</button><div><button id=power>POWER</button><button id=brake>BRAKE</button></div></div><p>LIVE AUDIO MIXER</p><label>ENGINE<input id=engine type=range value=65></label><label>GRASS<input id=grass type=range value=80></label><label>PRIZES<input id=prizes type=range value=100></label><select id=mode><option>Arcade</option><option selected>Soft Crunch</option><option>Realistic</option></select><button id=full>FULL SCREEN</button><p id=best></p></main><script>const $=s=>document.getElementById(s),g=$('c').getContext('2d'),W=640,H=420;let ax=0,ay=0,gas=false,brake=false,boost=false,active=false,started=false,done=false,t=0,cash=0,last=0,cutTime=0,ac,osc,eg,filter,buf,gb,pb,clock=0;const clamp=(v,l,h)=>Math.max(l,Math.min(h,v));function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}function ell(x,y,w,h,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,Math.max(.1,w),Math.max(.1,h),0,0,7);g.fill()}function poly(p,c){g.fillStyle=c;g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill()}function txt(s,x,y,n=16,c='white'){g.fillStyle=c;g.font=`bold ${n}px monospace`;g.fillText(s,x,y)}function audio(){try{if(!ac){ac=new AudioContext();osc=ac.createOscillator();osc.type='sawtooth';eg=ac.createGain();eg.gain.value=0;filter=ac.createBiquadFilter();filter.type='lowpass';osc.connect(filter);filter.connect(eg);eg.connect(ac.destination);osc.start();gb=ac.createGain();pb=ac.createGain();gb.connect(ac.destination);pb.connect(ac.destination);buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);let a=buf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}ac.resume()}catch(e){}}function noise(f,d,b){if(!ac)return;let s=ac.createBufferSource(),q=ac.createBiquadFilter(),v=ac.createGain();s.buffer=buf;q.type='lowpass';q.frequency.value=f;v.gain.setValueAtTime(.15,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);s.connect(q);q.connect(v);v.connect(b);s.start();s.stop(ac.currentTime+d)}function prize(bad=false){if(!ac)return;if(bad){noise(300,.35,pb);return} [660,880,1320].forEach((f,i)=>{let o=ac.createOscillator(),v=ac.createGain(),n=ac.currentTime+i*.1;o.frequency.value=f;v.gain.setValueAtTime(.1,n);v.gain.exponentialRampToValueAtTime(.001,n+.2);o.connect(v);v.connect(pb);o.start(n);o.stop(n+.21)})}function sound(dt){if(!ac)return;let m=$('mode').selectedIndex,n=ac.currentTime;eg.gain.setTargetAtTime(active&&gas?[.047,.033,.03][m]*$('engine').value/100:0,n,.06);osc.frequency.setTargetAtTime([130,105,85][m]*(cutTime>0?.81:1),n,.08);filter.frequency.value=[320,230,420][m];gb.gain.value=$('grass').value/100;pb.gain.value=$('prizes').value/100;clock-=dt;if(active&&cutTime>0&&clock<=0){noise([1700,850,1250][m],.08,gb);clock=[.075,.09,.055][m]}cutTime=Math.max(0,cutTime-dt)}let pid=null;function move(e){let r=$('stick').getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width*.25),y=(e.clientY-r.top-r.height/2)/(r.height*.25),m=Math.hypot(x,y),s=Math.pow(clamp((m-.08)/.92,0,1),1.3);ax=m?x/m*s:0;ay=m?y/m*s:0;$('knob').style.transform=`translate(${ax*12}px,${ay*12}px)`} $('stick').onpointerdown=e=>{pid=e.pointerId;$('stick').setPointerCapture(pid);move(e)};$('stick').onpointermove=e=>{if(e.pointerId===pid)move(e)};$('stick').onpointerup=$('stick').onpointercancel=$('stick').onlostpointercapture=()=>{pid=null;ax=ay=0;$('knob').style.transform='none'};let tap=-1000;$('power').onpointerdown=e=>{audio();$('power').setPointerCapture(e.pointerId);boost=performance.now()-tap<380;tap=performance.now();gas=true};$('power').onpointerup=$('power').onpointercancel=$('power').onlostpointercapture=()=>gas=boost=false;if($('brake')){$('brake').onpointerdown=e=>{$('brake').setPointerCapture(e.pointerId);brake=true};$('brake').onpointerup=$('brake').onpointercancel=$('brake').onlostpointercapture=()=>brake=false}const key='mow-'+document.title;function save(){try{localStorage.setItem(key,JSON.stringify({best:Math.max(cash,+(JSON.parse(localStorage.getItem(key)||'{}').best||0)),engine:$('engine').value,grass:$('grass').value,prizes:$('prizes').value,mode:$('mode').selectedIndex}))}catch(e){}}try{let s=JSON.parse(localStorage.getItem(key)||'{}');for(let k of ['engine','grass','prizes'])if(s[k]!=null)$(k).value=s[k];if(s.mode!=null)$('mode').selectedIndex=s.mode;$('best').textContent='Best earnings: $'+Math.floor(s.best||0)}catch(e){}for(let k of ['engine','grass','prizes','mode'])$(k).onchange=save;$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};$('start').onclick=()=>{audio();if(!started||done){reset();started=true;done=false;active=true}else active=!active;gas=false;$('start').textContent=active?'PAUSE':'RESUME'};function finish(){active=false;done=true;gas=false;save();$('start').textContent='RESTART';prize()} let pos,lane,speed,hp,jump,jv,lean,obs,cut,parts,msg,mt,found;const hill=x=>34*Math.sin(x/190)+17*Math.sin(x/77)+12*Math.sin(x/410),ground=(x,l)=>175+l*45-hill(x);function reset(){pos=0;lane=1;speed=135;hp=100;jump=jv=lean=t=cash=mt=found=0;msg='';cut=new Set();parts=[];obs=[];for(let x=350;x<6900;x+=160+Math.random()*210)obs.push({x,l:Math.floor(Math.random()*4),k:['puddle','log','rabbit','dog','person','rock','ball','treasure'][Math.floor(Math.random()*8)]})}function update(dt){let slope=(hill(pos+4)-hill(pos-4))/8,target=brake?18:gas?(boost?409:300):135+Math.max(0,ax)*50;speed+=(clamp(target-slope*65,0,409)-speed)*Math.min(1,dt*3);let old=pos;pos+=speed*dt;lane=clamp(lane+ay*2.8*dt,0,3);lean+=(ax<0?ax*.55:ax*.1-lean)*Math.min(1,dt*6);lean=clamp(lean,-.55,.2);if(!jump&&speed>155&&slope>.1&&(hill(pos+15)-hill(pos))/15<.08)jv=80+(speed-155)*.55;if(jv||jump){jump+=jv*dt;jv-=260*dt;if(jump<=0)jump=jv=0}if(jump<8)for(let i=Math.floor(old/12);i<=Math.floor(pos/12);i++){let k=i*4+Math.round(lane);if(!cut.has(k)){cut.add(k);cash+=.45;cutTime=.13;for(let j=0;j<5;j++)parts.push({x:135,y:ground(pos,lane),vx:-80-Math.random()*180,vy:-Math.random()*100,life:.5})}}for(let o of obs)if(!o.used&&Math.abs(o.x-pos)<25&&Math.abs(o.l-lane)<.55&&jump<20){o.used=true;mt=2;msg=o.k.toUpperCase();if(o.k==='ball'||o.k==='treasure'){let v=o.k==='ball'?15:75;cash+=v;found++;msg+=' +$'+v;prize()}else{prize(true);if(o.k==='log'&&ax<-.45){jv=150;msg='CLEAN WHEELIE!'}else{speed*=o.k==='rock'?.3:.65;hp-=o.k==='rock'?18:o.k==='log'?8:0}}}mt-=dt;for(let p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);if(pos>=7000||hp<=0)finish()}function draw(){rect(0,0,640,420,'#8fbdd3');for(let i=0;i<8;i++)ell(((i*155-pos*.12)%1000+1000)%1000-100,125,120,70,'#648d60');for(let l=3;l>=0;l--){let pts=[];for(let X=0;X<=640;X+=8)pts.push([X,ground(pos+X-140,l)-20]);pts.push([640,420],[0,420]);poly(pts,['#749a43','#80a34a','#6e913d','#88a64b'][l])}for(let l=0;l<4;l++)for(let X=0;X<640;X+=12){let wx=pos+X-140,Y=ground(wx,l);if(!cut.has(Math.floor(wx/12)*4+l))poly([[X-3,Y],[X+4,Y],[X+6,Y-15]],'#416d29')}for(let o of obs){let X=140+o.x-pos,Y=ground(o.x,o.l);if(o.used||X<-50||X>690)continue;if(o.k==='puddle')ell(X,Y,28,9,'#5ca5c7');else if(o.k==='log')rect(X-20,Y-13,40,13,'#79502b');else if(o.k==='rock')ell(X,Y-9,15,12,'#777');else if(o.k==='ball')ell(X,Y-8,8,8,'#e1e950');else if(o.k==='treasure')rect(X-12,Y-18,24,18,'#e6b63f');else{ell(X,Y-13,14,10,'#b99c78');ell(X+12,Y-23,8,8,'#a4835e')}}let Y=ground(pos,lane)-jump;g.save();g.translate(140,Y);g.rotate(lean);ell(-19,0,15,15,'#202020');ell(23,0,11,11,'#202020');ell(-19,0,7,7,'#888');ell(23,0,5,5,'#888');rect(-32,-22,66,19,'#b82c24');rect(5,-33,28,15,'#d94330');rect(-15,-45,19,26,'#315b87');ell(-5,-54,12,12,'#f1c644');g.restore();for(let p of parts)rect(p.x,p.y,7,2,'#c0d479');rect(0,0,640,48,'#202720');txt('$'+Math.floor(cash)+'  '+Math.round(speed*.22)+' km/h',10,20,18,'#ffe16c');txt('HP '+hp+'  FINDS '+found+'  '+Math.floor(pos/70)+'%',10,39,14);txt(gas?(boost?'SUPER BOOST':'TURBO'):'',450,25,18,'#ffcf56');if(mt>0)txt(msg,220,80,20,'#ffe16c')} reset();function frame(n){let dt=Math.min(.04,(n-(last||n))/1000);last=n;if(active){t+=dt;update(dt)}sound(dt);draw();if(!active){rect(70,135,500,130,'#202820ed');txt(done?'JOB COMPLETE — $'+Math.floor(cash):started?'PAUSED':'PRESS START',105,190,25,'#ffe18a');txt('MOW MONEY',105,230)}requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
