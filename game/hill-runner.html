<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hill Runner — Analog Revival</title><style>body{margin:0;background:#171717}main{max-width:760px;margin:auto}button{cursor:pointer}a{color:#d9ae70;font:12px monospace}</style></head><body><main><a href="mow-money-menu.html">MOW MONEY / GAMES</a>
<div style="background:#171717;padding:6px;border-radius:10px;font-family:monospace;user-select:none">
<canvas id="screen" width="640" height="400" style="width:100%;display:block;border-radius:5px;image-rendering:pixelated"></canvas>
<div style="background:#c9c8bf;border:3px solid #99988f;border-radius:9px;padding:12px;margin-top:8px;box-shadow:inset 0 3px #e5e3da">
<div style="background:#242424;border-radius:5px;padding:9px;display:flex;align-items:center;justify-content:space-between">
<div id="pad" style="width:44%;aspect-ratio:1;touch-action:none"><svg viewBox="0 0 150 150" style="width:100%;pointer-events:none"><circle cx="75" cy="75" r="69" fill="#1a1a1a" stroke="#414141" stroke-width="2"/><g id="cross"><path d="M53 15H97V53H135V97H97V135H53V97H15V53H53Z" fill="#090909" stroke="#555" stroke-width="3" stroke-linejoin="round"/><path d="M57 20H93V57H130V93H93V130H57V93H20V57H57Z" fill="#303030"/><path d="M65 37L75 26L85 37M65 113L75 124L85 113M37 65L26 75L37 85M113 65L124 75L113 85" fill="none" stroke="#888" stroke-width="3"/><circle cx="75" cy="75" r="15" fill="#242424" stroke="#414141" stroke-width="2"/></g></svg></div>
<div style="width:22%;text-align:center"><div style="color:#d44838;font-weight:bold;font-size:13px">MOW<br>MONEY</div><div style="height:4px;background:#888;margin:9px 0"></div><button id="select" style="background:#101010;border:1px solid #777;color:#bbb;border-radius:15px;padding:6px 9px;font-size:9px;margin:4px 0">SELECT</button><button id="start" style="background:#101010;border:1px solid #777;color:#ddd;border-radius:15px;padding:6px 9px;font-size:9px;margin:4px 0">START</button></div>
<div style="width:32%;display:flex;align-items:center;gap:6px"><div style="width:48%;padding-top:34px;text-align:center"><button id="b" style="width:100%;aspect-ratio:1;border-radius:50%;border:3px solid #111;background:radial-gradient(circle at 35% 25%,#ef6255,#b42122 70%);box-shadow:0 4px #080808;color:white;font-size:20px;font-weight:bold;touch-action:none">B</button><div style="font-size:9px;color:#bbb;margin-top:7px">BRAKE</div></div><div style="width:48%;padding-bottom:34px;text-align:center"><button id="a" style="width:100%;aspect-ratio:1;border-radius:50%;border:3px solid #111;background:radial-gradient(circle at 35% 25%,#ef6255,#b42122 70%);box-shadow:0 4px #080808;color:white;font-size:20px;font-weight:bold;touch-action:none">A</button><div style="font-size:9px;color:#bbb;margin-top:7px">TURBO</div></div></div></div><div style="display:flex;justify-content:space-between;color:#343434;font-size:9px;padding-top:7px;font-weight:bold"><span>ANALOG CONTROL</span><span>DOUBLE TAP A: SUPER BOOST</span></div></div></div>
<script>
(()=>{
const $=s=>document.getElementById(s),c=$('screen'),g=c.getContext('2d'),W=640,H=400;
let ax=0,ay=0,gas=false,brake=false,boost=false,active=false,started=false,done=false,pid=null,tap=-1000,last=0,t=0,pos=0,lane=1,speed=135,hp=100,jump=0,jv=0,lean=0,lv=0,wet=0,bump=0,cash=0,found=0,msg='',mt=0,obs=[],parts=[],cut=new Set();
const clamp=(v,l,h)=>Math.max(l,Math.min(h,v)),hill=x=>34*Math.sin(x/190)+17*Math.sin(x/77)+12*Math.sin(x/410),ground=(x,l)=>175+l*45-hill(x),rnd=n=>{let r=Math.sin(n*127.1+31.7)*43758.5453;return r-Math.floor(r)};
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function poly(p,col){g.fillStyle=col;g.beginPath();p.forEach((v,i)=>i?g.lineTo(v[0],v[1]):g.moveTo(v[0],v[1]));g.closePath();g.fill()}
function ell(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}
function txt(s,x,y,n=15,col='#fff'){g.fillStyle=col;g.font=`bold ${n}px monospace`;g.fillText(s,x,y)}
function say(s){msg=s;mt=2}
function reset(){pos=0;lane=1;speed=135;hp=100;jump=jv=lean=lv=wet=bump=cash=found=t=mt=0;ax=ay=0;gas=brake=boost=false;cut=new Set();parts=[];obs=[];for(let x=350;x<6900;x+=160+Math.random()*210)obs.push({x,l:Math.floor(Math.random()*4),k:['puddle','log','rabbit','dog','person','rock','ball','treasure'][Math.floor(Math.random()*8)],used:false,dir:Math.random()<.5?-1:1});done=false}
function burst(x,y,n,kind){for(let i=0;i<n;i++)parts.push({x,y,vx:-50-Math.random()*speed*.85,vy:-20-Math.random()*150,life:.3+Math.random()*.6,col:(kind==='gold'?['#ffdd45','#fff4b3','#f1a52d']:kind==='water'?['#86d6ee','#c4f0ff','#529cc6']:['#c1d676','#8db94b','#476c28','#e0e6a0'])[i%(kind==='grass'?4:3)],s:2+Math.random()*5})}
function update(dt){t+=dt;wet=Math.max(0,wet-dt);bump=Math.max(0,bump-dt);mt=Math.max(0,mt-dt);
let slope=(hill(pos+4)-hill(pos-4))/8,target=brake?18:gas?(boost?409:300):135+Math.max(0,ax)*50;target-=slope*65;speed+=(clamp(target,0,boost&&gas?409:gas?300:210)-speed)*Math.min(1,dt*(boost&&gas?4:2.8));
let desired=ax<0?ax*.55:ax*(jump>0?.32:.10);lean+=(desired-lean)*Math.min(1,dt*6);lv+=(ay*2.8-lv)*Math.min(1,dt*(wet>0?2:12));lane=clamp(lane+lv*dt,0,3);
let old=pos;pos+=speed*dt;
if(jump===0&&jv===0&&speed>155&&slope>.10&&(hill(pos+15)-hill(pos))/15<.08)jv=80+(speed-155)*.55+Math.max(0,-ax)*20;
if(jv||jump){jump+=jv*dt;jv-=260*dt;if(jump<=0){jump=jv=0;if(lean<-.45){speed*=.8;say('HARD LANDING')}else if(lean>.25)speed*=.85}}
if(jump<8)for(let i=Math.floor(old/12);i<=Math.floor(pos/12);i++){let k=i*4+Math.round(lane);if(!cut.has(k)){cut.add(k);cash+=.45;burst(118,ground(pos,lane)-8,5,'grass')}}
for(let o of obs){if(o.used)continue;let d=o.x-pos;if(d<230&&d>-35&&['rabbit','dog','person'].includes(o.k)){o.l+=o.dir*dt*(o.k==='rabbit'?1.4:o.k==='dog'?.9:.65);if(o.l>3.2||o.l<-.2){o.dir*=-1;o.l=clamp(o.l,-.2,3.2)}}
if(Math.abs(d)<25&&Math.abs(o.l-lane)<.55&&jump<20){o.used=true;
if(o.k==='puddle'){wet=2;speed*=.65;burst(140,ground(pos,lane),35,'water');say('SLIPPERY!')}
else if(o.k==='log'){if(ax<-.45){jv=150;speed*=.9;say('CLEAN WHEELIE!')}else{jv=105;speed*=.65;hp-=8;say('BUMP!')}}
else if(o.k==='rock'){hp-=18;speed*=.3;bump=.8;say('OUCH! ROCK!')}
else if(o.k==='ball'||o.k==='treasure'){let v=o.k==='ball'?15:75;cash+=v;found++;burst(140,ground(pos,lane)-20,50,'gold');say('FOUND '+o.k.toUpperCase()+'! +$'+v)}
else{speed*=.2;say('WATCH OUT!')}}}
for(let p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.life-=dt}parts=parts.filter(p=>p.life>0).slice(-800);
if(pos>=7000||hp<=0){active=false;done=true;gas=boost=false;$('start').textContent='RESTART'}}
function tree(x,y,s){rect(x-4*s,y-46*s,8*s,46*s,'#6e5033');rect(x-2*s,y-46*s,3*s,46*s,'#a17b4a');poly([[x-28*s,y-30*s],[x-19*s,y-65*s],[x-5*s,y-78*s],[x+16*s,y-71*s],[x+29*s,y-45*s],[x+21*s,y-28*s]],'#345d35');poly([[x-23*s,y-48*s],[x-14*s,y-69*s],[x+2*s,y-74*s],[x+12*s,y-57*s],[x+4*s,y-40*s]],'#568747')}
function obstacle(o){let X=140+o.x-pos,Y=ground(o.x,o.l);if(o.used||X<-70||X>710)return;g.save();g.translate(X,Y);ell(0,1,23,5,'#334d2955');let step=Math.sin(t*15+o.x)*6;
switch(o.k){
case'puddle':ell(0,0,32,10,'#3c7e9d');ell(-2,-2,28,7,'#79bfd6');rect(-18,-4,15,2,'#c6e9e9');rect(5,3,16,2,'#a1d9e5');break;
case'log':rect(-23,-15,45,16,'#77502d');rect(-20,-14,40,4,'#b08549');rect(-16,-6,29,2,'#513a25');ell(22,-7,7,9,'#c6a36a');ell(22,-7,4,6,'#987242');break;
case'rock':poly([[-20,0],[-17,-13],[-6,-23],[12,-19],[22,-5],[17,0]],'#666f70');poly([[-17,-13],[-6,-23],[12,-19],[4,-10]],'#a4aeaa');break;
case'rabbit':g.translate(0,-Math.abs(step));rect(-13,-17,22,15,'#b9b4a2');rect(5,-24,12,14,'#d3cbb7');rect(7,-37,4,15,'#c3bba8');rect(13,-35,4,13,'#b8ae9b');rect(9,-33,2,8,'#c98e89');rect(15,-20,3,3,'#222');rect(-18,-14,6,7,'#eee7d5');rect(-11,-3,11,4,'#9a9486');break;
case'dog':rect(-22,-22,35,17,'#ac713c');rect(9,-30,17,18,'#c18a50');rect(20,-21,10,8,'#e0bc88');rect(28,-20,4,4,'#292929');rect(8,-31,7,15,'#69482e');rect(18,-26,3,3,'#222');rect(-17+step,-6,5,9,'#82542d');rect(5-step,-6,5,9,'#82542d');poly([[-22,-18],[-34,-30],[-30,-34],[-19,-24]],'#a9703e');break;
case'person':rect(-8,-53,16,14,'#d4a477');rect(-10,-57,20,7,'#d04a35');rect(-12,-39,24,23,'#e7c34d');rect(-17,-36,6,20,'#d4a477');rect(12,-36,6,20,'#d4a477');poly([[-10,-16],[0,-16],[step-3,0],[step-12,0]],'#394b68');poly([[0,-16],[10,-16],[12-step,0],[3-step,0]],'#394b68');rect(step-14,0,13,4,'#38352e');rect(2-step,0,13,4,'#38352e');break;
case'ball':ell(0,-10,10,10,'#d4e950');g.strokeStyle='#f4f5ce';g.lineWidth=2;g.beginPath();g.arc(-3,-10,7,-1.4,1.4);g.stroke();break;
case'treasure':rect(-16,-22,32,23,'#7e4d25');rect(-16,-24,32,9,'#c18b3b');rect(-12,-24,5,25,'#e9bd4c');rect(7,-24,5,25,'#e9bd4c');rect(-3,-14,7,8,'#ffe17a');break}g.restore()}
function wheel(x,y,r){ell(x,y,r,r,'#1c2020');for(let k=0;k<10;k++){let a=k*Math.PI/5+t*speed*.065;g.save();g.translate(x,y);g.rotate(a);rect(-3,-r,6,4,'#3c4140');g.restore()}ell(x,y,r*.61,r*.61,'#8b9392');ell(x,y,r*.43,r*.43,'#c5c8bd');for(let k=0;k<4;k++){let a=k*Math.PI/2+t*speed*.065;rect(x+Math.cos(a)*r*.32-1,y+Math.sin(a)*r*.32-1,3,3,'#4b5350')}ell(x,y,3,3,'#505956')}
function mower(){let Y=ground(pos,lane);ell(140,Y+3,40,8,'#263a2655');g.save();g.translate(140,Y-jump+(bump>0?Math.sin(t*50)*3:0));g.translate(-22,0);g.rotate(lean);g.translate(22,0);
wheel(-25,-3,16);wheel(31,1,11);rect(-39,-23,73,9,'#7e211c');rect(-36,-30,41,12,'#c63b2b');rect(-36,-30,41,4,'#f36b48');rect(-9,-13,40,7,'#a02a20');rect(-7,-15,34,4,'#ed583a');rect(6,-37,32,18,'#b62e24');rect(9,-41,27,7,'#ec5037');rect(12,-36,24,4,'#f67b51');rect(34,-35,5,13,'#363a37');for(let i=0;i<4;i++)rect(35,-34+i*3,4,1,'#a1a5a0');rect(37,-36,4,5,'#fff2b0');rect(-28,-36,20,5,'#242927');rect(-29,-40,5,9,'#333a36');rect(4,-45,4,15,'#3e4442');rect(-1,-47,15,4,'#292d2b');
poly([[-21,-38],[-7,-39],[3,-26],[15,-21],[12,-15],[-4,-18],[-18,-29]],'#405977');rect(7,-22,13,6,'#292b2a');let L=ax<0?-4:ax*6;
poly([[-26,-63],[-10+L,-65],[-2,-43],[-19,-37],[-29,-43]],'#285d8e');poly([[-24,-60],[-17,-61],[-13,-42],[-23,-44]],'#4c8cb6');poly([[-12+L,-59],[-5+L,-58],[4,-49],[11,-48],[11,-42],[0,-43],[-12,-52]],'#d7a477');rect(7,-49,7,6,'#292e2c');rect(-19+L,-70,12,13,'#d5a075');poly([[-28+L,-73],[-26+L,-84],[-18+L,-90],[-5+L,-89],[3+L,-81],[4+L,-72],[-5+L,-69],[-23+L,-69]],'#efbf36');rect(-22+L,-86,12,4,'#ffe58a');rect(-7+L,-79,14,7,'#303d45');rect(-6+L,-78,9,2,'#8eb0ba');rect(-23+L,-71,19,4,'#a97723');g.restore()}
function draw(){rect(0,0,W,H,'#91c5df');rect(0,95,W,65,'#c0dbe1');
for(let i=0;i<7;i++){let X=((i*170-pos*.055)%1190+1190)%1190-170;ell(X,68,37,9,'#e5edf0');ell(X-13,61,19,11,'#edf3f2');ell(X+12,59,16,13,'#edf3f2')}
for(let layer=0;layer<2;layer++){let p=[];for(let X=0;X<=W;X+=8)p.push([X,130+layer*14-Math.sin((X+pos*(layer?.22:.10))/140)*25-Math.sin((X+pos*.12)/67)*9]);p.push([W,H],[0,H]);poly(p,layer?'#6d9a62':'#84ac8a')}
for(let i=0;i<20;i++){let X=((i*93-pos*.42)%1860+1860)%1860-90;tree(X,145+Math.sin(i*2)*9,.48+rnd(i)*.25)}
for(let l=0;l<4;l++){let p=[];for(let X=0;X<=W;X+=6)p.push([X,ground(pos+X-140,l)-22]);p.push([W,H],[0,H]);poly(p,['#83a64d','#91b454','#7fa34a','#8bac50'][l]);for(let X=0;X<=W;X+=6){let wx=pos+X-140,Y=ground(wx,l);rect(X,Y+16,6,2,'#b4c57b')}}
for(let l=0;l<4;l++)for(let i=Math.floor((pos-140)/12);i<=Math.ceil((pos+500)/12);i++){let X=140+i*12-pos,Y=ground(i*12,l),k=i*4+l;if(cut.has(k)){rect(X-5,Y-8,12,17,'#b0c477');rect(X-3,Y,2,4,'#849e4f')}else{let h=9+rnd(k)*13;poly([[X-5,Y+3],[X-3,Y-h],[X+1,Y-3],[X+5,Y-h*.85],[X+4,Y+3]],'#527e31');poly([[X-2,Y],[X+2,Y-h*.7],[X+3,Y]],'#a3c45c')}}
let list=obs.filter(o=>!o.used&&o.x>pos-210&&o.x<pos+560).map(o=>({l:o.l,o}));list.push({l:lane});list.sort((a,b)=>a.l-b.l);for(let q of list)q.o?obstacle(q.o):mower();
for(let p of parts){g.globalAlpha=clamp(p.life*3,0,1);rect(p.x,p.y,p.s,p.s*.45,p.col)}g.globalAlpha=1;
if(speed>210)for(let i=0;i<18;i++){let X=((rnd(i+55)*800-t*speed*1.9)%800+800)%800-80,Y=90+rnd(i+99)*290;rect(X,Y,15+speed*.08,1,speed>310?'#ffdf7655':'#ffffff44')}
rect(0,0,W,49,'#202721');txt('$'+Math.floor(cash),12,21,21,'#ffe27c');txt(Math.round(speed*.22)+' km/h',135,21,18);txt('MOWER',12,39,10,'#c7d2bb');rect(62,30,94,10,'#51544c');rect(62,30,94*clamp(hp/100,0,1),10,hp>35?'#9fcb63':'#e4543b');txt('FINDS '+found,174,39,12,'#e4e8d9');txt('JOB '+Math.min(100,Math.floor(pos/70))+'%',332,20,15);rect(332,30,294,8,'#53594e');rect(332,30,294*clamp(pos/7000,0,1),8,'#9cbe65');txt(gas?(boost?'SUPER BOOST':'TURBO'):ax<-.45?'WHEELIE':'',490,20,15,'#ffcc4d');
if(mt>0){g.save();g.textAlign='center';txt(msg,320,80,21,'#fff0a0');g.restore()}
if(!active){rect(65,113,510,160,'#18221eea');g.save();g.textAlign='center';txt(done?(hp<=0?'MOWER BROKEN':'JOB COMPLETE'):started?'PAUSED':'HILL RUNNER',320,154,30,'#ffe17c');txt(done?'EARNINGS $'+Math.floor(cash):'MOW MONEY — ANALOG REVIVAL',320,190,17);txt(done?'PRESS START TO RETRY':started?'PRESS START TO RESUME':'PRESS START',320,240,16,'#e4e9cf');g.restore()}}
function move(e){let r=$('pad').getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width*.36),dy=(e.clientY-r.top-r.height/2)/(r.height*.36),m=Math.hypot(dx,dy),s=clamp((m-.12)/.88,0,1);ax=m?dx/m*s:0;ay=m?dy/m*s:0;$('cross').setAttribute('transform',`translate(${ax*5} ${ay*5})`)}
$('pad').onpointerdown=e=>{e.preventDefault();if(pid!==null)return;pid=e.pointerId;$('pad').setPointerCapture(pid);move(e)};
$('pad').onpointermove=e=>{if(e.pointerId===pid)move(e)};
$('pad').onpointerup=$('pad').onpointercancel=$('pad').onlostpointercapture=e=>{if(e.pointerId!==pid)return;pid=null;ax=ay=0;$('cross').setAttribute('transform','translate(0 0)')};
$('a').onpointerdown=e=>{e.preventDefault();$('a').setPointerCapture(e.pointerId);let n=performance.now();boost=n-tap<380;tap=n;gas=true;$('a').style.filter='brightness(.75)'};
$('a').onpointerup=$('a').onpointercancel=$('a').onlostpointercapture=()=>{gas=boost=false;$('a').style.filter=''};
$('b').onpointerdown=e=>{e.preventDefault();$('b').setPointerCapture(e.pointerId);brake=true;$('b').style.filter='brightness(.75)'};
$('b').onpointerup=$('b').onpointercancel=$('b').onlostpointercapture=()=>{brake=false;$('b').style.filter=''};
$('start').onclick=()=>{if(!started||done){reset();started=active=true}else{active=!active;gas=boost=brake=false;ax=ay=0}$('start').textContent=active?'PAUSE':'RESUME'};
$('select').onclick=()=>{reset();started=active=true;$('start').textContent='PAUSE'};
reset();function frame(n){let dt=Math.min(.04,(n-(last||n))/1000);last=n;if(active)update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)
})();
</script></main></body></html>
