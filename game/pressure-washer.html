<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pressure Washer v0.3</title><style>*{box-sizing:border-box}body{margin:0;background:#151d20;color:white;font: bold 14px monospace;user-select:none}main{max-width:700px;margin:auto;padding:7px}canvas{width:100%;display:block;border-radius:5px}.controller{background:#292d30;border:3px solid #454b4d;border-radius:12px;margin-top:8px;padding:12px;display:flex;align-items:center;justify-content:space-between}button{font:inherit;color:white;background:#171b1c;border:1px solid #777;border-radius:6px;padding:9px;touch-action:none}#joy{width:34%;aspect-ratio:1;touch-action:none}#spray{width:100%;aspect-ratio:1;border-radius:50%;border:5px solid #151819;background:radial-gradient(circle at 35% 25%,#ffad4a,#d55b19);box-shadow:0 5px #111}small{color:#aaa}</style></head><body><main><canvas id="pw" width="640" height="440"></canvas><div class="controller"><div id="joy"><svg viewBox="0 0 120 120" style="width:100%;pointer-events:none"><circle cx="60" cy="60" r="55" fill="#17191a" stroke="#616668" stroke-width="3"/><circle cx="60" cy="60" r="37" fill="#232729" stroke="#444"/><g id="knob"><circle cx="60" cy="64" r="23" fill="#080a0b"/><circle cx="60" cy="60" r="22" fill="#454b4d" stroke="#777" stroke-width="2"/><circle cx="60" cy="60" r="15" fill="#343a3c"/></g></svg></div><div style="text-align:center;width:30%"><div style="color:#efb14b">POWER<br>WASH</div><button id="start" style="margin:10px 0">START</button><br><small>NOZZLE</small><br><button id="nozzle">25°</button></div><div style="width:29%;text-align:center"><button id="spray">SPRAY</button><small>HOLD TRIGGER</small></div></div><p style="font-size:10px;color:#aaa">ANALOG AIM · 15° POWER · 40° COVERAGE</p></main><script>
(()=>{const $=s=>document.getElementById(s),g=$('pw').getContext('2d'),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),random=(a,b)=>a+Math.random()*(b-a);const config={seconds:90,budget:120,target:.95,speed:261,durability:1};const LIMIT=config.seconds;const layers=Array.from({length:3},()=>{let c=document.createElement('canvas');c.width=480;c.height=300;return c});const [base,dirt,damage]=layers,[bg,dg,eg]=layers.map(c=>c.getContext('2d',{willReadFrequently:true}));let x,y,ax=0,ay=0,vx,vy,gas=false,active=false,started=false,done=false,won=false,mode=1,pid=null,last=0,clock,progress,particles,wet,time,loss,eroding;const modes=[{angle:15,r:10,power:8,wear:1.7},{angle:25,r:20,power:4.8,wear:.85},{angle:40,r:32,power:2.6,wear:.32}],exposure=new Float32Array(9000),wear=new Float32Array(9000);
function reset(){x=240;y=150;vx=vy=progress=time=clock=loss=0;done=won=eroding=false;particles=[];wet=[];exposure.fill(0);wear.fill(0);eg.clearRect(0,0,480,300);bg.fillStyle='#b9b9af';bg.fillRect(0,0,480,300);for(let i=0;i<21000;i++){let n=Math.floor(random(130,210));bg.fillStyle=`rgba(${n},${n},${n-5},.24)`;bg.fillRect(random(0,480),random(0,300),random(1,4),random(1,3))}for(let i=1;i<3;i++){bg.fillStyle='#777d77';bg.fillRect(i*160,0,2,300);bg.fillStyle='#d4d5cb';bg.fillRect(i*160+2,0,1,300)}bg.fillStyle='#747b76';bg.fillRect(0,150,480,2);dg.globalCompositeOperation='source-over';dg.fillStyle='#55513b';dg.fillRect(0,0,480,300);for(let i=0;i<1600;i++){let a=random(0,480),b=random(0,300),r=random(3,35),gr=dg.createRadialGradient(a,b,0,a,b,r);gr.addColorStop(0,['#303b22aa','#766747aa','#242d1c99','#8a795488'][i%4]);gr.addColorStop(1,'#44440000');dg.fillStyle=gr;dg.fillRect(a-r,b-r,r*2,r*2)}for(let i=0;i<13000;i++){dg.fillStyle=i%2?'#a18d5a22':'#242c1e44';dg.fillRect(random(0,480),random(0,300),random(1,4),random(1,3))}for(let i=0;i<7;i++){let a=random(30,450),b=random(30,270),r=random(12,32),gr=dg.createRadialGradient(a,b,2,a,b,r);gr.addColorStop(0,'#20241cdd');gr.addColorStop(1,'#252b1c00');dg.fillStyle=gr;dg.fillRect(a-r,b-r,r*2,r*2)}}
function project(a,b){return [320+(a-240)*(.67+b/300*.45),100+b*.91]}function measure(){let d=dg.getImageData(0,0,480,300).data,sum=0;for(let i=3;i<d.length;i+=16)sum+=d[i]/255;progress=clamp(1-sum/36000,0,1)}function payment(){return Math.max(0,Math.floor((won?1:progress)*config.budget-loss))}
function erosion(dt,m){let r=m.r,i0=clamp(Math.floor((x-r)/4),0,119),i1=clamp(Math.floor((x+r)/4),0,119),j0=clamp(Math.floor((y-r)/4),0,74),j1=clamp(Math.floor((y+r)/4),0,74),l=i0*4,t=j0*4,w=(i1-i0+1)*4,h=(j1-j0+1)*4,data=dg.getImageData(l,t,w,h).data;for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){let px=i*4+2,py=j*4+2,d=Math.hypot(px-x,py-y)/r,k=j*120+i;if(d>.85||data[((py-t)*w+px-l)*4+3]>25)continue;exposure[k]+=dt*m.wear*(1-d*d)/config.durability;if(exposure[k]>1.25){let old=wear[k];wear[k]=clamp(old+dt*m.wear*(1-d)*.85/config.durability,0,1);if(wear[k]>old){eroding=true;loss+=(wear[k]-old)*.24;let v=Math.floor(177-wear[k]*93);eg.fillStyle=`rgb(${v},${v-5},${v-13})`;eg.fillRect(i*4,j*4,4,4);if(wear[k]>.3){eg.fillStyle='#5d5b4e';eg.fillRect(i*4+(i+j)%3,j*4+(i*7+j)%3,1,2);eg.fillStyle='#d3c9ad';eg.fillRect(i*4+2,j*4,1,1)}}}}}
function update(dt,elapsed){time=Math.min(LIMIT,time+elapsed);vx+=(ax*config.speed-vx)*Math.min(1,dt*16);vy+=(ay*config.speed-vy)*Math.min(1,dt*16);x=clamp(x+vx*dt,0,480);y=clamp(y+vy*dt,0,300);eroding=false;if(gas){let m=modes[mode],r=m.r;dg.globalCompositeOperation='destination-out';let gr=dg.createRadialGradient(x,y,r*.15,x,y,r);gr.addColorStop(0,`rgba(0,0,0,${Math.min(1,dt*m.power*5)})`);gr.addColorStop(.65,`rgba(0,0,0,${Math.min(1,dt*m.power*3)})`);gr.addColorStop(1,'rgba(0,0,0,0)');dg.fillStyle=gr;dg.fillRect(x-r,y-r,r*2,r*2);dg.globalCompositeOperation='source-over';erosion(dt,m);let p=project(x,y);for(let i=0;i<(eroding?24:12);i++)particles.push({x:p[0]+random(-r*.5,r*.5),y:p[1],vx:random(-110,110),vy:random(-100,-10),life:random(.15,.55),size:random(1,eroding?5:3),col:eroding&&i%2?'#b5ab91':i%3?'#d8f5ff':'#837b55'});wet.push({x,y,r:r*.8,life:5});if(wet.length>200)wet.shift()}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=210*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(let p of wet)p.life-=dt;wet=wet.filter(p=>p.life>0);clock+=dt;if(clock>.4||time>=LIMIT){clock=0;measure();if(progress>=config.target||time>=LIMIT){won=progress>=config.target;done=true;active=false;gas=false;$('start').textContent='RESTART'}}}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function poly(p,col){g.fillStyle=col;g.beginPath();p.forEach((v,i)=>i?g.lineTo(...v):g.moveTo(...v));g.closePath();g.fill()}function txt(s,x,y,n=16,col='#fff'){g.fillStyle=col;g.font=`bold ${n}px monospace`;g.fillText(s,x,y)}function line(a,b,c,d,w,col){g.lineCap='round';g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function draw(){rect(0,0,640,440,'#9ebdce');rect(0,58,640,382,'#7b9552');for(let i=0;i<20;i++){let a=i*36-10;rect(a,54,33,65,i%2?'#92734f':'#a1845d');poly([[a,54],[a+16,44],[a+33,54]],'#a1845d');rect(a+3,59,2,54,'#705b42')}rect(0,82,640,6,'#6d553b');for(let i=0;i<300;i++)rect((i*137.31)%640,110+(i*83.7)%330,2,5,'#66823d');for(let row=0;row<300;row+=2){let ww=480*(.67+row/300*.45),left=320-ww/2,yy=100+row*.91;for(let layer of [base,damage,dirt])g.drawImage(layer,0,row,480,2,left,yy,ww,2.1)}for(let p of wet){let q=project(p.x,p.y);g.fillStyle=`rgba(39,76,86,${p.life/5*.028})`;g.beginPath();g.ellipse(q[0],q[1],p.r,p.r*.6,0,0,Math.PI*2);g.fill()}let [tx,ty]=project(x,y),nx=430+(tx-320)*.45,ny=370+(ty-235)*.12,r=modes[mode].r;if(gas&&active){poly([[nx,ny],[tx-r,ty],[tx+r,ty]],'#e1f8ff55');for(let i=0;i<12;i++)line(nx,ny,tx+random(-r,r),ty+random(-4,4),1.5,'#e9fcff99');g.fillStyle='#ecffff88';g.beginPath();g.ellipse(tx,ty,r,5,0,0,Math.PI*2);g.fill()}for(let p of particles){g.globalAlpha=clamp(p.life*4,0,1);rect(p.x,p.y,p.size,p.size,p.col)}g.globalAlpha=1;let hx=540+(tx-320)*.16,hy=455;line(hx,hy,nx,ny,15,'#21292c');line(hx,hy,nx,ny,7,'#9ca7aa');line(hx-3,hy,nx-3,ny,2,'#d9dfdf');line(nx+5,ny+4,nx-5,ny-4,15,'#303637');line(nx,ny,nx-5,ny-4,8,'#e7b53e');poly([[hx-42,440],[hx-25,399],[hx-5,393],[hx+15,415],[hx+20,440]],'#bd8659');poly([[hx-35,421],[hx+8,421],[hx+35,440],[hx-45,440]],'#345d82');if(!gas){g.strokeStyle='#f4ffffaa';g.lineWidth=1;g.beginPath();g.ellipse(tx,ty,r,5,0,0,Math.PI*2);g.stroke()}let remaining=Math.ceil(Math.max(0,LIMIT-time)),timer=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');rect(0,0,640,47,'#192326');txt('CLEAN '+Math.floor(progress*100)+'%',12,20,18,'#b7e8bc');txt('$'+payment(),205,20,18,'#f5d67b');txt(timer,325,23,24,remaining<=15?'#ff7155':'#fff');txt(modes[mode].angle+'° '+(gas&&active?'SPRAYING':'READY'),465,20,14);rect(12,31,616,8,'#3d4b4d');rect(12,31,616*progress,8,'#91c88c');if(loss>0){rect(10,53,178,23,'#242726dd');txt('DAMAGE -$'+loss.toFixed(2),17,69,14,'#ff987c')}if(eroding&&active){rect(190,53,260,27,'#8d3326ee');txt('SURFACE DAMAGE!',210,72,20,'#fff0d2')}if(!active){rect(65,130,510,170,'#162326ee');g.save();g.textAlign='center';txt(done?(won?'DRIVEWAY COMPLETE':'TIME IS UP!'):started?'PAUSED':'PRESSURE WASHER',320,169,27,done&&!won?'#ff9376':'#f1c574');txt(done?(won?'CUSTOMER PAYMENT: $'+payment():'CLEANED '+Math.floor(progress*100)+'% — TRY AGAIN'):'Clean 95% in 90 seconds',320,205,17);txt(done?'Surface damage: $'+loss.toFixed(2):'Keep moving to avoid surface damage',320,234,15,'#c3d9d9');txt(done?'PRESS START TO REPLAY':started?'PRESS START TO RESUME':'PRESS START',320,275,15,'#c3d9d9');g.restore()}}
function move(e){let r=$('joy').getBoundingClientRect(),a=(e.clientX-r.left-r.width/2)/(r.width*.33),b=(e.clientY-r.top-r.height/2)/(r.height*.33),m=Math.hypot(a,b),s=clamp((m-.08)/.92,0,1);ax=m?a/m*s:0;ay=m?b/m*s:0;$('knob').setAttribute('transform',`translate(${ax*22} ${ay*22})`)}$('joy').onpointerdown=e=>{e.preventDefault();pid=e.pointerId;$('joy').setPointerCapture(pid);move(e)};$('joy').onpointermove=e=>{if(e.pointerId===pid)move(e)};$('joy').onpointerup=$('joy').onpointercancel=$('joy').onlostpointercapture=()=>{pid=null;ax=ay=0;$('knob').setAttribute('transform','translate(0 0)')};$('spray').onpointerdown=e=>{e.preventDefault();$('spray').setPointerCapture(e.pointerId);gas=true;$('spray').style.filter='brightness(.8)'};$('spray').onpointerup=$('spray').onpointercancel=$('spray').onlostpointercapture=()=>{gas=false;$('spray').style.filter=''};$('nozzle').onclick=()=>{mode=(mode+1)%3;$('nozzle').textContent=modes[mode].angle+'°'};$('start').onclick=()=>{if(!started||done){reset();started=true;active=true}else active=!active;gas=false;last=performance.now();$('start').textContent=active?'PAUSE':'RESUME'};reset();function frame(n){let elapsed=Math.max(0,(n-(last||n))/1000);last=n;if(active)update(Math.min(.04,elapsed),elapsed);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
