<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Mow Money: Backyard Rally</title><style>*{box-sizing:border-box}body{margin:0;background:#17251e;color:white;font: bold 15px system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:absolute;top:10px;left:10px;background:#14251ddd;padding:12px;border-radius:8px}#controls{position:absolute;bottom:12px;left:10px;right:10px;display:flex;gap:8px}button{flex:1;padding:19px 5px;background:#263e32df;color:white;border:1px solid #ffffff55;border-radius:10px;font:bold 16px system-ui;touch-action:none}#start{position:absolute;top:42%;left:20%;width:60%;background:#86d9b5;color:#13251c}#msg{position:absolute;top:85px;width:100%;text-align:center;text-shadow:1px 2px black;pointer-events:none}</style></head><body><div id="hud">MOW MONEY<br><span id="stats">Loading 3D engine…</span></div><div id="msg"></div><button id="start">START RACE</button><div id="controls"><button id="left">◀</button><button id="right">▶</button><button id="reverse">REV</button><button id="brake">BRAKE</button><button id="turbo">TURBO</button></div><script type="module">

let seed=72;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function texture(base,wood=false){let c=document.createElement('canvas');c.width=c.height=256;let g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,256,256);for(let i=0;i<15000;i++){g.fillStyle=rnd()<.5?'rgba(0,0,0,.09)':'rgba(255,255,210,.09)';g.fillRect(rnd()*256,rnd()*256,wood?1:2,wood?rnd()*90:3)}let t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;return t}const soil=texture('#617c38'),wood=texture('#967b56',true),bark=texture('#655039',true);soil.repeat.set(32,32);const mat=(color,map)=>new T.MeshStandardMaterial({color,map,roughness:.9});const brown=mat(0xffffff,bark),plank=mat(0xffffff,wood),leaf=mat(0x42652b),red=mat(0xb52e20),black=mat(0x222622),metal=mat(0x919a97),skin=mat(0xc58e64);function mesh(geo,m,x,y,z,parent=scene){let o=new T.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(w,h,d,m,x,y,z,p){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z,p)}const ground=mesh(new T.PlaneGeometry(64,56),mat(0xffffff,soil),0,0,0);ground.rotation.x=-Math.PI/2;ground.castShadow=false;const obstacles=[];for(let x=-32;x<32;x+=.5)for(let z of [-28,28])box(.48,2.1,.13,plank,x+.25,1.05,z);for(let z=-28;z<28;z+=.5)for(let x of [-32,32])box(.13,2.1,.48,plank,x,1.05,z+.25);function tree(x,z){obstacles.push({x,z,r:.65});mesh(new T.CylinderGeometry(.28,.5,4.8,9),brown,x,2.4,z);for(let i=0;i<16;i++)mesh(new T.IcosahedronGeometry(1.2+rnd(),1),mat(new T.Color().setHSL(.23+rnd()*.06,.4,.22+rnd()*.15)),x+(rnd()-.5)*3,4+rnd()*2,z+(rnd()-.5)*3)}[[-29,-12],[-5,12],[10,-16],[26,13],[0,24]].forEach(p=>tree(...p));function log(x,z,X,Z){let d=new T.Vector3(X-x,0,Z-z),len=d.length();let o=mesh(new T.CylinderGeometry(.48,.68,len,12),brown,(x+X)/2,.6,(z+Z)/2);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());for(let i=0;i<=len;i+=.6)obstacles.push({x:x+d.x*i,z:z+d.z*i,r:.7});for(let i=1;i<5;i++){let p=i/5;let b=mesh(new T.CylinderGeometry(.08,.18,2.7,7),brown,x+(X-x)*p,.8,z+(Z-z)*p);b.rotation.z=1.1;b.rotation.y=i;}}log(-30,-8,-30,5);log(30,-9,30,5);for(let i=0;i<12;i++){let x=-28+i*2,z=25;mesh(new T.IcosahedronGeometry(1.1,2),leaf,x,.8,z);obstacles.push({x,z,r:1})}box(5,3,4,plank,25,1.5,-22);let roof=box(5.5,.3,4.5,black,25,3.15,-22);obstacles.push({x:25,z:-22,r:3.4});
const route=[[-25,21],[-25,-20],[-10,-20],[-10,20],[5,20],[5,-20],[20,-20],[20,20],[28,20]];let gate=1,elapsed=0;const barriers=[];for(let k=0;k<3;k++){let X=-17.5+k*15;let from=k%2===0?-10:-26,to=k%2===0?26:10;for(let Z=from;Z<=to;Z+=1.1){obstacles.push({x:X,z:Z,r:.85});barriers.push([X,Z]);mesh(new T.IcosahedronGeometry(1.05,1),leaf,X,.75,Z)}}const marker=mesh(new T.TorusGeometry(1.5,.065,8,32),new T.MeshBasicMaterial({color:0xffd85a}),route[1][0],1.5,route[1][1]);const step=.55,cols=116,rows=101,cells=[],dummy=new T.Object3D();const bladeGeo=new T.BufferGeometry();bladeGeo.setAttribute('position',new T.Float32BufferAttribute([-.07,0,0,.07,0,0,.02,.5,0,0,0,-.07,0,0,.07,0,.42,.03],3));bladeGeo.computeVertexNormals();const grass=new T.InstancedMesh(bladeGeo,new T.MeshStandardMaterial({color:0xffffff,side:T.DoubleSide,roughness:1}),cols*rows*4);scene.add(grass);let count=0;function place(i,x,z,h,rot){dummy.position.set(x,0,z);dummy.rotation.set(0,rot,0);dummy.scale.set(1,h,1);dummy.updateMatrix();grass.setMatrixAt(i,dummy.matrix)}for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){let x=-31.6+i*step,z=-27.5+j*step;let p={x,z,ids:[],cut:false,blocked:obstacles.some(o=>Math.hypot(x-o.x,z-o.z)<o.r+.35)};cells.push(p);for(let k=0;k<4;k++){let X=x+(rnd()-.5)*step,Z=z+(rnd()-.5)*step,rot=rnd()*6.28,h=p.blocked?.05:.65+rnd()*.7;place(count,X,Z,h,rot);grass.setColorAt(count,new T.Color().setHSL(.19+rnd()*.08,.42+rnd()*.2,.23+rnd()*.2));p.ids.push({i:count++,x:X,z:Z,rot})}}grass.instanceMatrix.needsUpdate=true;const total=cells.filter(p=>!p.blocked).length;
const mower=new T.Group();camera.add(mower);scene.add(camera);box(.83,.16,.68,red,0,-.83,-1.25,mower);mesh(new T.CylinderGeometry(.23,.26,.23,24),black,0,-.65,-1.25,mower);mesh(new T.CylinderGeometry(.15,.15,.05,20),metal,0,-.51,-1.25,mower);for(let X of [-.44,.44])for(let Z of [-1.5,-1.02]){let w=mesh(new T.CylinderGeometry(.15,.15,.12,20),black,X,-.85,Z,mower);w.rotation.z=Math.PI/2}function rod(A,B,r,m,p){let a=new T.Vector3(...A),b=new T.Vector3(...B),d=b.clone().sub(a);let o=mesh(new T.CylinderGeometry(r,r,d.length(),10),m,...a.clone().add(b).multiplyScalar(.5).toArray(),p);o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize())}for(let s of [-1,1]){rod([s*.35,-.8,-1.05],[s*.38,-.45,-.43],.025,metal,mower);rod([s*.58,-.8,-.12],[s*.36,-.45,-.43],.075,skin,mower);mesh(new T.SphereGeometry(.085,12,8),skin,s*.36,-.45,-.43,mower)}rod([-.4,-.45,-.43],[.4,-.45,-.43],.035,black,mower);
const paint=new T.MeshStandardMaterial({color:0xb82018,metalness:.45,roughness:.28});const deck=mesh(new T.CylinderGeometry(.47,.49,.12,48),paint,0,-.81,-1.25,mower);deck.scale.z=.82;box(.34,.12,.27,black,0,-.53,-1.24,mower);for(let i=0;i<7;i++)box(.38,.018,.25,metal,0,-.73+i*.025,-1.25,mower);box(.22,.09,.27,black,.47,-.79,-1.25,mower);for(let side of [-1,1])for(let Z of [-1.5,-1.02]){let hub=mesh(new T.CylinderGeometry(.085,.085,.13,24),metal,side*.45,-.85,Z,mower);hub.rotation.z=Math.PI/2;}const clippings=[];const clipGeo=new T.PlaneGeometry(.035,.14);const clipMat=new T.MeshBasicMaterial({color:0x83ad43,side:T.DoubleSide});for(let i=0;i<180;i++){let o=new T.Mesh(clipGeo,clipMat);scene.add(o);o.visible=false;clippings.push({o,life:0,v:new T.Vector3()})}let clipIndex=0;function spray(){for(let n=0;n<9;n++){let p=clippings[clipIndex++%clippings.length];p.life=.45+rnd()*.5;p.o.visible=true;p.o.position.set(x+Math.cos(yaw)*.55-Math.sin(yaw)*.85,.22,z-Math.sin(yaw)*.55-Math.cos(yaw)*.85);p.v.set(Math.cos(yaw)*(2+rnd()*3),1+rnd()*2,-Math.sin(yaw)*(2+rnd()*3));p.o.rotation.set(rnd()*6,rnd()*6,rnd()*6)}}const finds=[];function item(x,z,type){let m=type==='ball'?mat(0xc8da42):type==='poo'?mat(0x69401e):type==='rock'?mat(0x777b72):mat(0xe1d6b9);let o=mesh(type==='ball'?new T.SphereGeometry(.12,12,8):new T.IcosahedronGeometry(type==='rock'?.32:.17,1),m,x,.13,z);finds.push({x,z,type,o,used:false})}item(-23,19,'poo');item(-15,7,'ball');item(3,-8,'rock');item(17,18,'bone');item(-5,-20,'poo');item(12,-10,'ball');let x=-25,z=21,yaw=0,v=0,hp=100,cut=0,found=0,active=false,keys={},cool=0,notice=0;const stats=document.getElementById('stats'),msg=document.getElementById('msg');function say(s){msg.textContent=s;notice=2}for(let k of ['left','right','reverse','brake','turbo']){let b=document.getElementById(k);b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[k]=true};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[k]=false}let km={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'brake',ArrowUp:'turbo',r:'reverse'};onkeydown=e=>{if(km[e.key])keys[km[e.key]]=true};onkeyup=e=>{if(km[e.key])keys[km[e.key]]=false};document.getElementById('start').onclick=()=>{active=true;document.getElementById('start').style.display='none'};onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;cool=Math.max(0,cool-dt);notice-=dt;if(notice<0)msg.textContent='';if(active){elapsed+=dt;if(gate<route.length){let q=route[gate];marker.position.set(q[0],1.5,q[1]);if(Math.hypot(x-q[0],z-q[1])<3){gate++;say(gate===route.length?"FINISH!":"Checkpoint!");}}yaw+=((keys.left?1:0)-(keys.right?1:0))*dt*1.65;let target=keys.brake?0:keys.reverse?-1.8:keys.turbo?6:3;v+=(target-v)*Math.min(1,dt*5);let X=x-Math.sin(yaw)*v*dt,Z=z-Math.cos(yaw)*v*dt;if(Math.abs(X)>31.2||Math.abs(Z)>27.2||obstacles.some(o=>Math.hypot(X-o.x,Z-o.z)<o.r+.48)){if(cool===0&&Math.abs(v)>.5){hp=Math.max(0,hp-5);cool=.9;say('Mower collision!')}v=0}else{x=X;z=Z}let cx=x-Math.sin(yaw)*.85,cz=z-Math.cos(yaw)*.85;let i=Math.round((cx+31.6)/step),j=Math.round((cz+27.5)/step);for(let J=Math.max(0,j-2);J<=Math.min(rows-1,j+2);J++)for(let I=Math.max(0,i-2);I<=Math.min(cols-1,i+2);I++){let p=cells[J*cols+I];if(!p.cut&&!p.blocked&&Math.hypot(p.x-cx,p.z-cz)<.63){p.cut=true;cut++;spray();for(let q of p.ids)place(q.i,q.x,q.z,.08,q.rot);grass.instanceMatrix.needsUpdate=true}}for(let f of finds)if(!f.used&&Math.hypot(cx-f.x,cz-f.z)<.65){f.used=true;f.o.visible=false;if(f.type==='rock'){hp=Math.max(0,hp-15);say('Rock strike!')}else if(f.type==='poo')say('Dog poo splat!');else{found++;say('Found: '+f.type)}}if(hp<=0||gate===route.length){active=false;say(hp<=0?'Mower broken — reload to retry':'Job complete!')}}for(let p of clippings){if(p.life<=0)continue;p.life-=dt;p.o.position.addScaledVector(p.v,dt);p.v.y-=5*dt;p.o.ro
