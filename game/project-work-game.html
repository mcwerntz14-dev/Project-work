function queryParts(q){let words=tokens(q).filter(w=>!(vocabulary.stopwords||[]).includes(w)),parts=[];while(words.length){let found=null;for(let n=Math.min(4,words.length);n>=1;n--){let phrase=words.slice(0,n).join(' '),id=conceptFor(phrase);if(id){found={value:phrase,concept:id,size:n};break}}if(found){parts.push(found);words.splice(0,found.size)}else parts.push({value:words.shift(),concept:null})}return parts}
function score(item,query){const parts=queryParts(query);if(!parts.length)return 1;const fields=[{value:norm(item.title),weight:12},{value:norm((item.skills||[]).join(' ')),weight:10},{value:norm(item.category),weight:8},{value:norm(item.description),weight:6},{value:norm(item.location),weight:3}];let total=0;for(const part of parts){let best=0,related=part.concept?vocabulary.concepts[part.concept]:null;for(const f of fields){if((' '+f.value+' ').includes(' '+part.value+' '))best=Math.max(best,f.weight+6);else if(part.value.length>=4&&tokens(f.value).some(w=>close(part.value,w)))best=Math.max(best,f.weight+2)}if(related){for(const term of related.terms||[])for(const f of fields)if((' '+f.value+' ').includes(' '+norm(term)+' '))best=Math.max(best,Math.max(2,f.weight-2));if((related.categories||[]).includes(item.category))best=Math.max(best,3)}if(!best)return 0;total+=best}return total}
function drawCategories(){const el=$('categories');el.replaceChildren();const cats=['All',...new Set(listings.map(i=>i.category).filter(Boolean))].sort((a,b)=>a==='All'?-1:b==='All'?1:a.localeCompare(b));for(const cat of cats){const b=document.createElement('button');b.type='button';b.className='chip'+(cat===state.category?' active':'');b.textContent=cat;b.setAttribute('aria-pressed',String(cat===state.category));b.onclick=()=>{state.category=cat;drawCategories();render()};el.append(b)}}
function symbol(item){const s=norm([item.title,item.category,...(item.skills||[])].join(' '));if(/sew|fabric|dress|tailor|cloth/.test(s))return '🧵';if(/leather|bag|wallet/.test(s))return '👜';if(/yard|lawn|weed|garden|landscap/.test(s))return '🌿';if(/fence|gate|wood|carpent/.test(s))return '🪚';if(/paint/.test(s))return '🎨';if(/plumb|faucet|pipe/.test(s))return '🔧';if(/haul|move|pickup|delivery/.test(s))return '🚚';if(/metal|weld|fabricat/.test(s))return '⚙️';if(/clean/.test(s))return '🧹';return item.emoji||'🛠️'}
function safeUrl(s){if(typeof s!=='string')return null;try{const u=new URL(s,location.href);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function artwork(item){const art=document.createElement('div');art.className='art';const demoImages={'demo-001':'gate-repair.jpg','demo-002':'sofa-moving.jpg','demo-003':'leather-tool-roll.jpg','demo-004':'yard-cleanup.jpg','demo-005':'reptile-enclosure.jpg','demo-006':'outdoor-faucet.jpg','demo-007':'work-apron.jpg','demo-008':'storage-shelving.jpg'};const url=gameImages[demoImages[item.id]|| (item.game?"yard-cleanup.jpg":"")];const fallback=()=>{if(art.querySelector('.symbol'))return;const span=document.createElement('span');span.className='symbol';span.textContent=symbol(item);art.prepend(span)};if(url){const img=document.createElement('img');img.src=url;img.loading='lazy';img.alt=item.imageAlt||`Image for ${item.title}`;img.referrerPolicy='no-referrer';img.onerror=()=>{img.remove();fallback()};art.append(img)}else fallback();const label=document.createElement('span');label.className='image-type';label.textContent=url?(item.imageType==='actual'?'Actual photo':item.imageType==='reference'?'Reference image':'AI illustration'):'Category illustration';art.append(label);return art}
function priceLabel(item){
 // Price metadata must be derived by the publisher from the original post; never from community reports.
 const p=item.pricing;
 if(!p||!p.type)return 'No Price Listed';
 const amount=(p.amount!==undefined&&p.amount!==null&&String(p.amount).trim()!=='')?String(p.amount):'';
 const types={budget:'Budget',existing_quote:'Existing Quote',negotiable:'Negotiable',accepting_offers:'Accepting Offers',quote_requested:'Quote Requested',hourly:'Hourly Rate',range:'Price Range',no_price:'No Price Listed',barter:'Trade / Barter'};
 const name=types[p.type];if(!name)return 'No Price Listed';
 return amount?name+': '+amount:name;
}
function statusFor(item){return (item.status==='in_progress'||item.status==='completed')?item.status:'available'}
function ageLabel(date){if(!date)return '';const d=new Date(date+'T12:00:00');if(!Number.isFinite(d.getTime()))return String(date);const days=Math.max(0,Math.floor((Date.now()-d.getTime())/86400000));return days===0?'Today':days===1?'1d ago':days+'d ago'}
function card(item){const article=document.createElement('button');article.type='button';article.className='card';article.setAttribute('aria-label','View '+item.title);article.append(artwork(item));const body=document.createElement('div');body.className='content';const h=document.createElement('h2');h.textContent=item.title;body.append(h);const place=document.createElement('p');place.className='place';place.textContent=item.location+' · '+ageLabel(item.posted);body.append(place);const pricing=document.createElement('p');pricing.className='price-line';pricing.textContent=priceLabel(item);body.append(pricing);if(statusFor(item)!=='available'){const s=document.createElement('p');s.className='status-line';s.textContent=statusFor(item)==='completed'?'Job Completed':'Work in Progress';body.append(s)}article.append(body);article.addEventListener('click',()=>openDetails(item));return article}
let activeItem=null;
function openDetails(item,fromHistory=false){activeItem=item;const content=$('dialog-content');content.replaceChildren();const top=document.createElement('div');top.className='dialog-inner';const close=document.createElement('button');close.className='dialog-close';close.textContent='← Back to projects';close.onclick=closeDetails;top.append(close);const h=document.createElement('h2');h.textContent=item.title;top.append(h);const p=document.createElement('p');p.className='place';p.textContent=item.location+' · '+ageLabel(item.posted);top.append(p);const badges=document.createElement('div');badges.className='dialog-status';for(const value of [priceLabel(item),statusFor(item)==='completed'?'Job Completed':statusFor(item)==='in_progress'?'Work in Progress':'No status reports']){const b=document.createElement('span');b.className='pill';b.textContent=value;badges.append(b)}top.append(badges);content.append(top);const art=artwork(item);art.classList.add('detail-image');art.style.aspectRatio='16/9';content.append(art);const lower=document.createElement('div');lower.className='dialog-inner';const desc=document.createElement('p');desc.className='dialog-description';desc.textContent=item.description||'';lower.append(desc);const contact=document.createElement('button');contact.className='open';contact.textContent=item.game?'Contact Projecteer':'Minigame coming soon';contact.disabled=!item.game;contact.onclick=()=>messenger(item);lower.append(contact);content.append(lower);if(!$('details').open)$('details').showModal();if(!fromHistory){history.pushState({projectId:item.id},'', '#project='+encodeURIComponent(item.id))}}
function closeDetails(){if(history.state&&history.state.projectId){history.back()}else{$('details').close();activeItem=null}}
window.addEventListener('popstate',()=>{const id=new URLSearchParams(location.hash.slice(1)).get('project');const item=listings.find(x=>x.id===id);if(item)openDetails(item,true);else if($('details').open){$('details').close();activeItem=null}});
$('details').addEventListener('cancel',e=>{e.preventDefault();closeDetails()});
function resetFilters(){state.category='All';$('search').value='';$('location').value='all';$('sort').value='new';drawCategories();render();$('search').focus()}function showMatches(){state.category='All';$('location').value='all';drawCategories();render()}
function render(){const q=$('search').value.trim(),mode=$('location').value,sort=$('sort').value;const matching=listings.map(item=>({item,rank:score(item,q)})).filter(x=>x.rank>0);const data=matching.filter(({item})=>(state.category==='All'||item.category===state.category)&&(mode==='all'||item.mode===mode)).sort((a,b)=>q?(b.rank-a.rank||(sort==='new'?b.item.posted.localeCompare(a.item.posted):a.item.posted.localeCompare(b.item.posted))):(sort==='new'?b.item.posted.localeCompare(a.item.posted):a.item.posted.localeCompare(b.item.posted)));$('count').textContent=`${data.length} project${data.length===1?'':'s'} found`;$('clear').hidden=!(q||mode!=='all'||state.category!=='All'||sort!=='new');if(data.length){$('cards').replaceChildren(...data.map(x=>card(x.item)));return}const empty=document.createElement('div');empty.className='empty';empty.setAttribute('role','status');const message=document.createElement('p');const outside=matching.length&&(mode!=='all'||state.category!=='All');message.textContent=outside?`${matching.length} matching project${matching.length===1?'':'s'} found outside your selected filters.`:q?'No matching projects for that search. Try a different phrase.':'No projects match these filters.';empty.append(message);const btn=document.createElement('button');btn.className='reset';btn.textContent=outside?'Show matching projects':'Clear all filters';btn.onclick=outside?showMatches:resetFilters;empty.append(btn);$('cards').replaceChildren(empty)}
function initialize(){listings=gameListings;vocabulary=gameVocabulary;drawCategories();render()}
function messenger(item){const content=$('dialog-content');content.replaceChildren();const panel=document.createElement('div');panel.className='dialog-inner';content.append(panel);function add(tag,txt,cls){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;panel.append(e);return e}const back=add('button','← Project details','dialog-close');back.onclick=()=>openDetails(item,true);add('h2',item.poster);add('p','Fictional Projecteer · '+item.title,'hint');add('p',item.game==='hill-runner.html'?'Hi! The yard is hilly and there may be obstacles hiding in the grass. Can you handle it?':'Hi! Please watch out for anything hiding in the weeds.','bubble');const choices=document.createElement('div');panel.append(choices);for(const reply of ['I can do that!','Anything else I should know?','Is your budget firm?']){const btn=document.createElement('button');btn.className='open';btn.style.marginTop='8px';btn.textContent=reply;choices.append(btn);btn.onclick=()=>{choices.remove();add('p',reply,'bubble mine');add('p',reply==='Is your budget firm?'?'Yes, the listed budget is my offer.':reply==='Anything else I should know?'?'Take care around the obstacles. Thanks!':'Great! Come on over.','bubble');const start=add('button','Start project','open');start.onclick=()=>{const frame=document.createElement('iframe');frame.title=item.title;frame.src='https://mcwerntz14-dev.github.io/Project-work/game/'+item.game;frame.style.cssText='width:100%;height:70vh;border:0;background:#111';content.replaceChildren();const exit=document.createElement('button');exit.className='open';exit.textContent='Return to messenger';exit.onclick=()=>messenger(item);content.append(exit,frame);const direct=document.createElement('a');direct.className='open';direct.href=frame.src;direct.target='_blank';direct.rel='noopener';direct.textContent='Open game separately';content.append(direct)};add('p','Preview: game results and payments are not connected yet.','hint')}}}
$('clear').onclick=resetFilters;for(const id of ['search','location','sort'])$(id).addEventListener(id==='search'?'input':'change',render);initialize();
</script></body></html>
